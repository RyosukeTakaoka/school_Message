# XcodeGen 用のプロジェクト定義
#
#   brew install xcodegen
#   xcodegen generate
#
# `SchoolMessage.xcodeproj` を毎回この定義から作り直す.
# .pbxproj を人が編集しないことで, 複数人で触ったときの競合を避けられる.
#
# リポジトリにコミットしてある .xcodeproj は「開いてすぐビルドできる」ための
# ものなので, 壊れた・設定を変えたい場合はこのファイルを直して再生成する.

name: SchoolMessage

options:
  bundleIdPrefix: com.schoolmessage
  developmentLanguage: ja
  # グループ階層をディレクトリ構造に合わせる
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  # 生成時に既存の .xcodeproj を置き換える
  generateEmptyDirectories: false

# 全ターゲット共通
settings:
  base:
    SWIFT_VERSION: "5.0"
    # CKRecord / CKQuery が Sendable ではないため, まずは minimal から始める.
    # 段階的に targeted -> complete へ上げていく想定.
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO

targets:
  SchoolMessage:
    type: application
    platform: iOS

    sources:
      # Swift・アセットカタログ・.lproj をまとめて取り込む
      - path: SchoolMessage

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schoolmessage.app
        PRODUCT_NAME: SchoolMessage
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

        # Info.plist と entitlements は同期対象の外(Config/)に置いている.
        # 同じフォルダに入れるとリソースとして二重にコピーされるため.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/SchoolMessage.entitlements

        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

        # 1 = iPhone, 2 = iPad. レイアウトは iPad 前提だが,
        # NavigationSplitView は狭い幅で 1 カラムに畳まれるので iPhone でも動く.
        TARGETED_DEVICE_FAMILY: "1,2"

        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM: XXXXXXXXXX   # 自分の Team ID を入れると署名が自動で通る

schemes:
  SchoolMessage:
    build:
      targets:
        SchoolMessage: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
